name: ci

# Builds everything and runs every test suite. No secrets, so this runs on forks
# and pull requests too -- the APKs it produces are signed with the throwaway
# dev key each build.sh generates on demand, and are NOT installable as upgrades
# over a release build. That is deliberate: see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build.sh wants $ANDROID_SDK/build-tools/37.0.0 and
      # $ANDROID_SDK/platforms/android-37.0. Note the platform package is
      # literally "android-37.0", not "android-37" -- its AndroidVersion.ApiLevel
      # is "37.0".
      #
      # Two traps here, both found the hard way on 2026-10-30:
      #
      # 1. Do NOT reintroduce `yes | sdkmanager --licenses`. sdkmanager exits
      #    before `yes` finishes writing, `yes` dies on SIGPIPE, and under
      #    `set -o pipefail` that 141 aborts the step. This failed two CI runs
      #    before anything was built. Current cmdline-tools does not need it --
      #    it answers "The --licenses option is no longer needed" -- and
      #    installs these packages with no license step at all.
      #
      # 2. Keep the cmdline-tools pin current. The old pin (11076708) could see
      #    `platforms;android-37.0` but refused to install it without accepted
      #    licenses, and **exited 0 having installed nothing** -- which is why
      #    the `test -x` / `test -f` assertions below are not redundant. They
      #    are the only thing that catches a silent no-op install.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="$HOME/android"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            'build-tools;37.0.0' 'platforms;android-37.0'
          test -x "$SDK/build-tools/37.0.0/aapt2"
          test -f "$SDK/platforms/android-37.0/android.jar"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build everything and run all tests
        run: |
          set -uo pipefail
          fail=0
          for d in thor-*/; do
            d=${d%/}
            [ -f "$d/build.sh" ] || { echo "::notice::$d has no build.sh (file-overlay module)"; continue; }
            echo "::group::$d"
            if ( cd "$d" && ./build.sh ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$d failed"
              fail=1
            fi
          done
          exit $fail

      # Fail loudly if a dev-signed APK ever looks like a release one. On CI the
      # dev key is expected; this only asserts we know which key was used.
      - name: Report APK signatures
        run: |
          set -uo pipefail
          BT="$ANDROID_SDK/build-tools/37.0.0"
          for apk in thor-*/dist/*.apk; do
            [ -f "$apk" ] || continue
            fp=$("$BT/apksigner" verify --print-certs "$apk" 2>/dev/null \
                 | grep -m1 -oE 'SHA-256 digest: [0-9a-f]+' | cut -d' ' -f3)
            printf '%-44s %s\n' "$apk" "${fp:0:16}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-builds
          path: |
            thor-*/dist/*.zip
            thor-*/dist/*.apk
          if-no-files-found: error
