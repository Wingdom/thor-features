name: release

# Builds signed artifacts and attaches them to a GitHub Release.
#
# Signing uses the real release key, injected from encrypted secrets:
#   THOR_KEYSTORE_B64   base64 of thor-release.jks
#   THOR_KEYSTORE_PASS  its password
#
# The keystore itself is never in the repository -- it lives outside the working
# tree so `git clean -xfd` cannot destroy it. Losing it means these apps can
# never be updated again, only uninstalled and reinstalled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write        # needed to create the Release

env:
  # The release certificate every APK must carry. If an APK does not match this,
  # the build used the dev-key fallback and must not ship: Android would refuse
  # to upgrade over it, and users would have to uninstall and lose their data.
  EXPECTED_CERT: 2101dfb8d131ba9dbf00ca67c1030f6ed3ef167909c71c45702c742d6a8e0875

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Refuse to build unsigned
        env:
          KS_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THOR_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ]  || { echo "::error::secret THOR_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "::error::secret THOR_KEYSTORE_PASS is not set"; exit 1; }
          echo "both signing secrets present"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="$HOME/android"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            'build-tools;37.0.0' 'platforms;android-37.0'
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      # Written outside the workspace so it cannot be picked up by a build, and
      # to a path that is removed in the always() cleanup step below.
      - name: Materialise the signing key
        env:
          KS_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THOR_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing/thor-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/thor-release.jks"
          echo "THOR_KEYSTORE=$RUNNER_TEMP/signing/thor-release.jks" >> "$GITHUB_ENV"
          echo "THOR_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build everything
        run: |
          set -uo pipefail
          fail=0
          for d in thor-*/; do
            d=${d%/}
            [ -f "$d/build.sh" ] || continue
            echo "::group::$d"
            ( cd "$d" && ./build.sh ) || { echo "::error::$d failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # The dev-key fallback in build.sh is silent by design, so this is the
      # guard that stops a mis-signed release from shipping.
      - name: Verify every APK carries the release certificate
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK/build-tools/37.0.0"
          n=0; bad=0
          for apk in thor-*/dist/*.apk; do
            [ -f "$apk" ] || continue
            n=$((n+1))
            fp=$("$BT/apksigner" verify --print-certs "$apk" 2>/dev/null \
                 | grep -m1 -oE 'SHA-256 digest: [0-9a-f]+' | cut -d' ' -f3)
            if [ "$fp" = "$EXPECTED_CERT" ]; then
              echo "ok   $apk"
            else
              echo "::error::$apk signed with $fp, expected $EXPECTED_CERT"
              bad=1
            fi
          done
          [ "$n" -eq 5 ] || { echo "::error::expected 5 APKs, found $n"; bad=1; }
          exit $bad

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp thor-*/dist/*.zip thor-*/dist/*.apk release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          body: |
            Magisk modules and Quick Settings APKs for the AYN Thor on LineageOS 24.

            All five APKs are signed with the project release key
            (`SHA-256 2101dfb8…`). **If you have an older build installed, signed
            with the per-app dev keys, you must uninstall it first** — Android
            refuses to upgrade across a signature change.

            `SHA256SUMS` covers every attached file.

      - name: Shred the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
