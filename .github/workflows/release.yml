name: release

# One release per component, so each app has its own version stream and
# Obtainium only offers an update when that app actually changed.
#
# Tag format:  thor-<component>-v<version>
#   thor-fan-tile-v0.5.0   -> builds thor-fan-tile, releases its APK
#   thor-stickfx-v0.1.4    -> builds thor-stickfx, releases its module zip
#
# The tag version must match the component's own declared version. A mismatch
# fails the build rather than publishing an artifact whose filename and
# metadata disagree with its tag -- which is exactly what Obtainium would then
# compare against.
#
# Signing uses the real release key from encrypted secrets:
#   THOR_KEYSTORE_B64   base64 of thor-release.jks
#   THOR_KEYSTORE_PASS  its password

on:
  push:
    tags: ['thor-*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. thor-fan-tile-v0.5.0'
        required: true

permissions:
  contents: write

env:
  EXPECTED_CERT: 2101dfb8d131ba9dbf00ca67c1030f6ed3ef167909c71c45702c742d6a8e0875

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse and validate the tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag: $TAG"
          [[ "$TAG" =~ ^(thor-.+)-v(.+)$ ]] || {
            echo "::error::tag must look like thor-<component>-v<version>"; exit 1; }
          COMPONENT="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          [ -d "$COMPONENT" ]            || { echo "::error::no such component: $COMPONENT"; exit 1; }
          [ -f "$COMPONENT/build.sh" ]   || { echo "::error::$COMPONENT has no build.sh"; exit 1; }

          # The tag must agree with what the component says about itself.
          if [ -f "$COMPONENT/magisk/module.prop" ]; then
            DECLARED=$(awk -F= '/^version=/{print $2}' "$COMPONENT/magisk/module.prop" | tr -d 'v')
            KIND=module
          else
            DECLARED=$(awk -F= '/^VERSION=/{print $2}' "$COMPONENT/build.sh" | head -1)
            KIND=app
          fi
          [ "$DECLARED" = "$VERSION" ] || {
            echo "::error::tag says $VERSION but $COMPONENT declares $DECLARED"; exit 1; }

          echo "COMPONENT=$COMPONENT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"     >> "$GITHUB_ENV"
          echo "KIND=$KIND"           >> "$GITHUB_ENV"
          echo "validated: $KIND $COMPONENT $VERSION"

      - name: Refuse to build unsigned
        if: env.KIND == 'app'
        env:
          KS_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THOR_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ]  || { echo "::error::secret THOR_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "::error::secret THOR_KEYSTORE_PASS is not set"; exit 1; }

      - name: Set up JDK
        if: env.KIND == 'app'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Keep the cmdline-tools pin current, and do not reintroduce
      # `yes | sdkmanager --licenses` -- it dies on SIGPIPE under pipefail.
      # See the longer note in ci.yml.
      - name: Install Android SDK packages
        if: env.KIND == 'app'
        run: |
          set -euo pipefail
          SDK="$HOME/android"
          mkdir -p "$SDK/cmdline-tools" && cd "$SDK/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            'build-tools;37.0.0' 'platforms;android-37.0'
          test -x "$SDK/build-tools/37.0.0/aapt2"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      # Both secrets are whitespace-stripped before use, and the decoded
      # keystore is verified against EXPECTED_CERT here rather than after the
      # build. Two reasons, both hit on the first real release (2026-10-30):
      #
      #   - `base64 -d` failed with "invalid input" on all five APK tags. A
      #     secret picks up a trailing newline very easily -- `gh secret set X
      #     < file` keeps it -- and any stray CR makes the whole value invalid.
      #   - thor-release.pass is 33 bytes for a 32-character password, i.e. it
      #     ends in a newline. `--ks-pass pass:<pw>\n` is the WRONG password,
      #     so a newline that survives into the password fails later, during
      #     signing, with a far less obvious error than this one.
      #
      # Nothing derived from a secret is ever echoed. The stripped password is
      # re-masked, because GitHub only masks the exact registered string and a
      # trimmed variant would otherwise print in the clear.
      - name: Materialise the signing key
        if: env.KIND == 'app'
        env:
          KS_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THOR_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/thor-release.jks"

          B64=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          echo "::add-mask::$PASS"

          # Diagnose shape, never content, so a bad secret is actionable.
          BAD=$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "base64 secret: ${#B64} chars after stripping whitespace, $BAD outside the base64 alphabet"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::THOR_KEYSTORE_B64 contains $BAD characters that are not base64."
            echo "::error::Re-set it with: base64 -w0 thor-release.jks | gh secret set THOR_KEYSTORE_B64 --repo <repo>"
            exit 1
          fi

          if ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::THOR_KEYSTORE_B64 is not valid base64 (${#B64} chars)."
            exit 1
          fi
          chmod 600 "$KS"
          [ -s "$KS" ] || { echo "::error::decoded keystore is empty"; exit 1; }

          # Confirm the password opens it AND that it is the expected key,
          # before the build spends ten minutes signing with the wrong one.
          if ! OUT=$(keytool -list -v -keystore "$KS" -storepass "$PASS" 2>&1); then
            echo "::error::the keystore did not open. THOR_KEYSTORE_PASS is wrong,"
            echo "::error::or carried whitespace. Set it from a file with no trailing"
            echo "::error::newline: printf %s \"\$(cat thor-release.pass)\" | gh secret set THOR_KEYSTORE_PASS --repo <repo>"
            exit 1
          fi
          FP=$(printf '%s' "$OUT" | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-Z' 'a-z')
          [ "$FP" = "$EXPECTED_CERT" ] || {
            echo "::error::keystore cert is $FP, expected $EXPECTED_CERT"; exit 1; }
          echo "ok: release keystore decoded, opened, and matches EXPECTED_CERT"

          echo "THOR_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "THOR_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: cd "$COMPONENT" && ./build.sh

      # build.sh falls back to a dev key silently so forks can build, which
      # makes a mis-signed release the failure mode worth guarding.
      - name: Verify the APK
        if: env.KIND == 'app'
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK/build-tools/37.0.0"
          APK="$COMPONENT/dist/$COMPONENT-v$VERSION.apk"
          [ -f "$APK" ] || { echo "::error::expected $APK"; exit 1; }
          fp=$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null \
               | grep -m1 -oE 'SHA-256 digest: [0-9a-f]+' | cut -d' ' -f3)
          [ "$fp" = "$EXPECTED_CERT" ] || {
            echo "::error::$APK signed with $fp, expected the release key"; exit 1; }
          # metadata must match the tag, or Obtainium compares the wrong thing
          vn=$("$BT/aapt2" dump badging "$APK" | grep -m1 -oE "versionName='[^']*'" | cut -d"'" -f2)
          [ "$vn" = "$VERSION" ] || {
            echo "::error::$APK reports versionName $vn, tag says $VERSION"; exit 1; }
          echo "ok: signed with the release key, versionName $vn"

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$COMPONENT"/dist/*"$VERSION"* release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.COMPONENT }} v${{ env.VERSION }}
          files: release/*
          generate_release_notes: true

      - name: Shred the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
